name: BookTrack CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: TypeScript, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No formatter is currently configured in this repository.
      - name: Run application tests
        run: npm test

      - name: Test SQL migration locally
        run: npm run test:sql

      - name: Check production build
        run: npm run build
        env:
          # CI needs no Supabase secrets. This build is never deployed.
          VITE_SUPABASE_URL: https://ci.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  deploy:
    name: Deploy production to Vercel
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check deployment secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@64.2.0

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Validate Vercel production configuration
        run: node scripts/check-deployment-config.mjs

      - name: Build Vercel production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Validate prebuilt production artifacts
        run: node scripts/check-deployment-config.mjs --artifacts

      - name: Deploy prebuilt production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Check public production page
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 --output /tmp/booktrack-production.html https://booktrack-one.vercel.app/
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const html = await readFile('/tmp/booktrack-production.html', 'utf8');
          assert.ok(html.includes('id="root"') && html.includes('/assets/'), 'Production must serve the BookTrack app');
          NODE
